name: Supabase CI

# Issue #278: replay the full migration chain onto an empty local database
# and run the pgTAP RLS / RPC tests in supabase/tests/. Uses only the
# runner's own throwaway Docker database -- no live project, no secrets.

on:
  pull_request:
    paths:
      - "supabase/**"
      - ".github/workflows/supabase.yml"
  push:
    branches:
      - master
    paths:
      - "supabase/**"
      - ".github/workflows/supabase.yml"
  workflow_dispatch:

jobs:
  db-test:
    name: db-test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Start local database
        run: supabase db start

      - name: Reset database (replay migrations + seed)
        run: supabase db reset

      - name: Run pgTAP tests
        run: supabase test db

      - name: Stop local database
        if: always()
        run: supabase stop --no-backup
