name: React Native CI

# pull_request has no paths filter on purpose: rn-verify is a required check
# on master, so it must report on every PR (docs-only included). The job's
# "Detect relevant changes" step skips the heavy steps when nothing under
# react_native_app/ or .github/ changed. Pushes to master keep their filter.
on:
  pull_request:
  push:
    branches:
      - master
    paths:
      - "react_native_app/**"
      - ".github/workflows/react-native.yml"

jobs:
  rn-verify:
    name: rn-verify
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: react_native_app
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          # Full history so the PR diff against the base branch can be computed.
          fetch-depth: 0

      # Required checks must always report on PRs (branch ruleset), so the
      # job always runs and only skips its heavy steps when nothing relevant
      # changed. Pushes, manual runs, and any diff failure run everything.
      # Changes under .github/ count as relevant to every job.
      - name: Detect relevant changes
        id: changes
        working-directory: .
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          PATTERN: '^(react_native_app/|\.github/)'
        run: |
          if [ "$EVENT_NAME" != "pull_request" ]; then
            echo "relevant=true" >> "$GITHUB_OUTPUT"
            echo "Not a pull_request event; running all steps."
            exit 0
          fi
          if ! files=$(git diff --name-only "origin/${BASE_REF}...HEAD"); then
            echo "relevant=true" >> "$GITHUB_OUTPUT"
            echo "::warning::Could not diff against origin/${BASE_REF}; running all steps."
            exit 0
          fi
          echo "Changed files:"; echo "$files"
          if echo "$files" | grep -Eq "$PATTERN"; then
            echo "relevant=true" >> "$GITHUB_OUTPUT"
          else
            echo "relevant=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No relevant changes; skipping heavy steps and reporting success."
          fi

      - name: Set up Node
        if: steps.changes.outputs.relevant == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: react_native_app/package-lock.json

      - name: Install dependencies
        if: steps.changes.outputs.relevant == 'true'
        run: npm ci

      - name: Lint
        if: steps.changes.outputs.relevant == 'true'
        run: npm run lint

      - name: Type-check
        if: steps.changes.outputs.relevant == 'true'
        run: npx tsc --noEmit

      - name: Test
        if: steps.changes.outputs.relevant == 'true'
        run: npm test -- --ci
